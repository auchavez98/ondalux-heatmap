<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{site}}{{page.path}}">
  <link rel="alternate" hreflang="en" href="{{site}}{{page.en}}">
  <link rel="alternate" hreflang="es" href="{{site}}{{page.es}}">
  <link rel="alternate" hreflang="x-default" href="{{site}}{{page.en}}">
  <meta name="theme-color" content="#0b0d12">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ondalux Heatmap">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{site}}{{page.path}}">
  <meta property="og:image" content="{{site}}/assets/shots/{{lang}}/03-ap-selected.png">
  <meta property="og:locale" content="{{meta.locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css?v={{build}}">
  {{{adsHead}}}
  {{{jsonld}}}
  <script defer src="/assets/js/main.js?v={{build}}"></script>
</head>
<body class="page-{{page.key}}">
  <a class="skip" href="#main">{{nav.skip}}</a>

  <header class="nav" id="top">
    <div class="wrap nav__inner">
      <a class="brand" href="{{home}}" aria-label="Ondalux Heatmap">
        <img src="/assets/img/logo.png" width="32" height="32" alt="">
        <span>Ondalux <b>Heatmap</b></span>
      </a>
      <nav class="nav__links" aria-label="{{nav.label}}">
        <a href="{{home}}#features">{{nav.features}}</a>
        <a href="{{home}}#how">{{nav.how}}</a>
        <a href="{{home}}#screens">{{nav.screens}}</a>
        <a href="{{routes.guide}}"{{{current.guide}}}>{{nav.guide}}</a>
        <a href="{{routes.opensource}}"{{{current.opensource}}}>{{nav.oss}}</a>
      </nav>
      <div class="nav__actions">
        <a class="lang" href="{{page.other}}" hreflang="{{other.code}}" lang="{{other.code}}" title="{{other.name}}">{{other.short}}</a>
        <a class="btn btn--small btn--primary" href="{{home}}#download">{{nav.download}}</a>
        <button class="nav__toggle" aria-label="{{nav.menu}}" aria-expanded="false"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <div class="lang-hint" hidden>
    <span>{{other.hint}}</span>
    <a href="{{page.other}}">{{other.name}}</a>
    <button aria-label="{{other.close}}">×</button>
  </div>
