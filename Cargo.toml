[workspace]
resolver = "2"
members = [
    "crates/ondalux-core",
    "crates/ondalux-io",
    "crates/ondalux-scan",
    "crates/ondalux-app",
    "crates/ondalux-report",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/auchavez98/ondalux-heatmap"
homepage = "https://ondaluxheatmap.com"

[workspace.dependencies]
ondalux-core = { path = "crates/ondalux-core" }
ondalux-io = { path = "crates/ondalux-io" }
ondalux-scan = { path = "crates/ondalux-scan" }
serde = { version = "1", features = ["derive"] }
rayon = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
