[package]
name = "ondalux-app"
description = "Ondalux Heatmap desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ondalux"
path = "src/main.rs"

[dependencies]
ondalux-core.workspace = true
ondalux-io.workspace = true
ondalux-scan.workspace = true
eframe = "0.36"
rfd = "0.17"
ondalux-report = { version = "0.1.0", path = "../ondalux-report" }
dirs = "6"
egui-phosphor = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
